<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة طلاب التحفيظ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f3f5f4;color:#1c2a25;font-size:16px;padding-bottom:78px}
header{position:sticky;top:0;background:#14634a;color:#fff;padding:12px 14px;font-weight:700;z-index:5}
main{padding:10px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #cfd8d4;z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:#555;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:18px}
nav button.on{color:#14634a;font-weight:700;background:#e6f3ee}
.card{background:#fff;border-radius:10px;padding:10px;margin:8px 0;border-right:5px solid #cfd8d4;box-shadow:0 1px 2px #0001}
.card.s-p{border-color:#2e9e5b}.card.s-a{border-color:#d64545}.card.s-l{border-color:#e69b1e}.card.s-e{border-color:#3b7fd4}.card.s-y{border-color:#8a54c9}
.card.sent{background:#eef8f2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button,.btn{font:inherit;font-size:14px;border:1px solid #b9c6c0;background:#fff;border-radius:8px;padding:8px 10px;color:#1c2a25}
button.pri{background:#14634a;color:#fff;border-color:#14634a}
button.red{color:#b32d2d;border-color:#e3b1b1}
.chip.on{color:#fff;border-color:transparent}
.chip.on.s-p{background:#2e9e5b}.chip.on.s-a{background:#d64545}.chip.on.s-l{background:#e69b1e}.chip.on.s-e{background:#3b7fd4}.chip.on.s-y{background:#8a54c9}
.chip.on.v{background:#14634a}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid #b9c6c0;border-radius:8px;background:#fff;margin:3px 0}
input[type=checkbox]{width:auto;margin:0 0 0 6px}
label{display:block;margin:8px 0;font-size:14px}
.bar{display:flex;gap:6px;margin:6px 0}
.bar input{flex:1}
.muted{color:#6b7a74}.small{font-size:12px}
.warn{background:#fff3cd;border:1px solid #ecd47a;padding:8px;border-radius:8px;margin:6px 0;font-size:14px}
.int{color:#a13a3a;font-size:12px;font-weight:700}
.shr{color:#14634a;font-size:12px;font-weight:700}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sum span{background:#fff;border-radius:16px;padding:4px 10px;font-size:13px;border:1px solid #d5ded9}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid #d5ded9;padding:5px;text-align:center}
th{background:#e6f3ee}
td.l,th.l{text-align:right}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;z-index:20;font-size:14px}
h3{margin:12px 0 4px}
#print{display:none}
@media print{#app,.toast{display:none!important}#print{display:block;direction:rtl;font-size:12px}body{background:#fff;padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
'use strict';
/* ========== أدوات عامة ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const fd=d=>d.replaceAll('-','/');
const hash=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const STATUSES=['حاضر','غائب','متأخر','مستأذن','غادر مبكرًا'];
const SCLASS={'حاضر':'s-p','غائب':'s-a','متأخر':'s-l','مستأذن':'s-e','غادر مبكرًا':'s-y'};
const CHANNELS=['واتساب','SMS','تيليجرام','بدون إرسال'];
const KEY='halaqa_db_v1';

const DEF_TPL={
'حاضر':'السلام عليكم ورحمة الله وبركاته،\nنحيطكم علمًا بأن ابنكم {الطالب} حضر إلى مركز التحفيظ اليوم {التاريخ}، ونسأل الله أن يوفقه.\n{التفاصيل}\n{ملاحظة}',
'غائب':'السلام عليكم ورحمة الله وبركاته،\nنحيطكم علمًا بغياب ابنكم {الطالب} اليوم {التاريخ} عن حلقة التحفيظ.\n{ملاحظة}',
'متأخر':'السلام عليكم ورحمة الله وبركاته،\nوصل ابنكم {الطالب} إلى المركز اليوم {التاريخ} في الساعة {الوقت}.\n{التفاصيل}\n{ملاحظة}',
'مستأذن':'السلام عليكم ورحمة الله وبركاته،\nنحيطكم علمًا بأن ابنكم {الطالب} مستأذن اليوم {التاريخ}.\n{ملاحظة}',
'غادر مبكرًا':'السلام عليكم ورحمة الله وبركاته،\nغادر ابنكم {الطالب} المركز مبكرًا اليوم {التاريخ} في الساعة {الوقت}.\n{التفاصيل}\n{ملاحظة}'
};
function defaults(){return{v:1,pin:'',lastBackup:'',
 settings:{center:'مركز التحفيظ'},
 students:[],
 points:[
  {id:'p_recite',key:'recite',name:'التسميع',type:'choice',options:'سمّع المقرر،تسميع غير مكتمل،لم يسمّع',active:true,share:true},
  {id:'p_new',name:'حفظ جديد',type:'text',options:'',active:true,share:true},
  {id:'p_rev',name:'مراجعة سابقة',type:'text',options:'',active:true,share:true},
  {id:'p_lvl',name:'مستوى التسميع',type:'choice',options:'ممتاز،جيد جدًا،جيد،مقبول،ضعيف',active:true,share:false},
  {id:'p_beh',name:'السلوك والانضباط',type:'text',options:'',active:true,share:false}
 ],
 acts:[
  {id:'a_thumn',name:'تسميع الثمن',pts:1,auto:'thumn'},
  {id:'a_late',name:'التأخير',pts:-1,auto:'late'},
  {id:'a_abn',name:'الغياب بدون إذن',pts:-1,auto:'abs_no'},
  {id:'a_abx',name:'الغياب بإذن',pts:0,auto:'abs_ok'},
  {id:'a_rec',name:'تسميع',pts:2,more:true},
  {id:'a_rev',name:'مراجعة',pts:1,more:true,key:'review'},
  {id:'a_part',name:'تسميع جزئي',pts:1,more:true},
  {id:'a_fix',name:'تصحيح',pts:0,more:true},
  {id:'a_oth',name:'إضافة نقطة أخرى',pts:1,more:true}],
 ledger:[],
 records:{},
 templates:JSON.parse(JSON.stringify(DEF_TPL)),
 audit:[]};}

let DB,UI={nt:{},tab:'daily',date:today(),q:'',sq:'',open:new Set(),edit:null,hist:null,edits:{},rep:{type:'daily',from:'',to:''},unlocked:false,storageOK:true};

function load(){
 try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){UI.storageOK=false}
 try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):defaults()}catch(e){DB=defaults()}
 const d=defaults();
 for(const k in d)if(DB[k]===undefined)DB[k]=d[k];
 for(const k in DEF_TPL)if(!DB.templates[k])DB.templates[k]=DEF_TPL[k];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('تعذّر الحفظ! خذ نسخة احتياطية الآن')}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function dl(name,content,type){const b=new Blob([content],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function csv(rows){return '﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function printHTML(h){$('#print').innerHTML='<div dir="rtl">'+h+'</div>';window.print()}
function copyText(t){
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'),()=>fb())}else fb();
 function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ')}catch(e){toast('تعذّر النسخ')}a.remove()}
}
function rec(d,sid){DB.records[d]=DB.records[d]||{};return DB.records[d][sid]=DB.records[d][sid]||{status:'',time:'',vals:{},note:'',shareNote:''}}
function getRec(d,sid){return (DB.records[d]||{})[sid]||null}
function stuName(id){const s=DB.students.find(x=>x.id===id);return s?s.name:'(محذوف)'}
function normPhone(p){let d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='218'+d.slice(1);else if(d.length===9&&d[0]==='9')d='218'+d;return d}
function reciteClass(v){if(!v)return '';if(/(^|\s)(لم|لا)(\s|$)/.test(v))return 'no';if(/غير|ناقص|جزئ/.test(v))return 'part';return 'yes'}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return dstr(x)}

/* ========== الهيكل العام ========== */
function render(){
 migrate();
 if(DB.pin&&!UI.unlocked){$('#app').innerHTML=vLock();return}
 const tabs=[['daily','✅','التسجيل'],['today','📋','التفاصيل'],['students','👥','الطلاب'],['points','⭐','النقاط'],['msgs','✉️','الرسائل'],['reports','📊','التقارير'],['backup','💾','الإعدادات']];
 const v={daily:vDaily,today:vToday,students:vStudents,points:vPoints,msgs:vMsgs,reports:vReports,backup:vBackup}[UI.tab]();
 $('#app').innerHTML='<header>'+esc(DB.settings.center)+'</header><main>'+warn()+v+'</main><nav>'+tabs.map(t=>'<button class="'+(UI.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav>';
 if(UI.tab==='today'||UI.tab==='daily')renderList();
 if(UI.tab==='students'&&!UI.edit&&!UI.hist)stuList();
}
function go(t){UI.tab=t;UI.edit=null;UI.hist=null;render();window.scrollTo(0,0)}
function warn(){
 let h='';
 if(!UI.storageOK)h+='<div class="warn">⚠ المتصفح لا يسمح بحفظ البيانات في هذا الوضع. افتح الملف من Chrome مباشرة.</div>';
 if(DB.students.length&&(!DB.lastBackup||(Date.now()-new Date(DB.lastBackup))/864e5>7))h+='<div class="warn">💾 لم تأخذ نسخة احتياطية منذ أكثر من أسبوع. افتح «الإعدادات» ← نسخة احتياطية.</div>';
 return h;
}
function vLock(){return '<main style="padding-top:60px"><div class="card"><h3>أدخل الرمز السري</h3><input type="password" id="pinin" inputmode="numeric" onkeydown="if(event.key===\'Enter\')unlock()"><button class="pri" onclick="unlock()">دخول</button></div></main>'}
function unlock(){if(hash($('#pinin').value)===DB.pin){UI.unlocked=true;render()}else toast('الرمز غير صحيح')}

/* ========== شاشة اليوم ========== */
function vToday(){
 return '<div class="bar"><input type="date" value="'+UI.date+'" onchange="UI.date=this.value||today();render()"><button onclick="UI.date=today();render()">اليوم</button></div>'+
 '<div id="sum"></div>'+
 '<div class="bar"><input placeholder="بحث بالاسم" value="'+esc(UI.q)+'" oninput="UI.q=this.value;renderList()"><button onclick="allPresent()">الكل حاضر</button></div><div id="list"></div>';
}
function renderList(){if(UI.tab==='daily'){renderDaily();return}
 const recs=DB.records[UI.date]||{};const q=UI.q.trim();
 const act=sortS(DB.students.filter(s=>s.active));
 const list=act.filter(s=>!q||s.name.includes(q));
 $('#list').innerHTML=list.map(s=>card(s,recs[s.id])).join('')||'<p class="muted">لا يوجد طلاب. أضفهم من تبويب «الطلاب».</p>';
 const c={};STATUSES.forEach(x=>c[x]=0);let un=0;
 act.forEach(s=>{const r=recs[s.id];if(r&&r.status)c[r.status]++;else un++});
 $('#sum').innerHTML='<div class="sum">'+STATUSES.map(x=>'<span>'+x+': <b>'+c[x]+'</b></span>').join('')+'<span>غير مسجّل: <b>'+un+'</b></span></div>';
}
function tog(id){UI.open.has(id)?UI.open.delete(id):UI.open.add(id);renderList()}
function logChange(sid,from,to){DB.audit.push({t:new Date().toISOString(),d:UI.date,sid,from,to});if(DB.audit.length>500)DB.audit.shift()}
function setStatus(sid,i){
 const r=rec(UI.date,sid),nv=STATUSES[i];
 if(r.status===nv){logChange(sid,r.status,'(ألغى)');r.status='';r.time=''}
 else{if(r.status)logChange(sid,r.status,nv);r.status=nv;r.time=UI.date===today()?nowT():(r.time||'')}
 save();renderList();
}
function setText(sid,pid,v){const r=rec(UI.date,sid);r.vals=r.vals||{};if(v.trim())r.vals[pid]=v.trim();else delete r.vals[pid];save()}
function setField(sid,k,v){const r=rec(UI.date,sid);r[k]=v;save()}
/* ========== الطلاب ========== */
function stuList(){
 const q=UI.sq.trim();
 const l=sortS(DB.students.filter(s=>!q||s.name.includes(q)));
 $('#stu').innerHTML=l.map(s=>'<div class="card"><div class="row"><span onclick="phOpen(\''+s.id+'\')">'+av(s,46)+'</span><b style="flex:1;margin:0 8px">'+esc(nm(s))+(s.active?'':' <span class="muted small">(متوقف)</span>')+'</b><span class="muted small">'+esc(s.phone||'')+'</span></div><div class="muted small">'+esc(s.parent||'')+(s.surah?' · السورة: '+esc(s.surah):'')+(s.type?' · '+esc(s.type):'')+'</div><div class="chips"><button onclick="UI.hist=\''+s.id+'\';render()">السجل</button><button onclick="UI.edit=\''+s.id+'\';render()">تعديل</button><button onclick="stuToggle(\''+s.id+'\')">'+(s.active?'إيقاف مؤقت':'تفعيل')+'</button><button class="red" onclick="stuDel(\''+s.id+'\')">حذف</button></div></div>').join('')||'<p class="muted">لا يوجد طلاب.</p>';
}
function stuToggle(id){const s=DB.students.find(x=>x.id===id);s.active=!s.active;save();stuList()}
function stuDel(id){
 const s=DB.students.find(x=>x.id===id);
 if(!confirm('حذف «'+s.name+'» نهائيًا مع كل سجلاته؟\nإن أردت الاحتفاظ بالسجل فاستخدم «إيقاف مؤقت».'))return;
 DB.students=DB.students.filter(x=>x.id!==id);
 for(const d in DB.records)delete DB.records[d][id];
 save();stuList();
}
function histRows(sid){
 const rows=[];
 Object.keys(DB.records).sort().reverse().forEach(d=>{const r=DB.records[d][sid];if(r&&(r.status||Object.keys(r.vals||{}).length||r.note||r.shareNote))rows.push([d,r])});
 return rows;
}
function history(){
 const s=DB.students.find(x=>x.id===UI.hist);if(!s){UI.hist=null;return vStudents()}
 const rows=histRows(s.id);const c={};STATUSES.forEach(x=>c[x]=0);rows.forEach(([d,r])=>{if(r.status)c[r.status]++});
 return '<div class="bar"><button onclick="UI.hist=null;render()">→ رجوع</button><button onclick="histCSV(\''+s.id+'\')">تصدير Excel</button><button onclick="histPrint(\''+s.id+'\')">طباعة / PDF</button></div><h3>'+esc(s.name)+'</h3><div class="muted small">مسجّل منذ '+fd(s.regDate||'')+'</div><div class="sum">'+STATUSES.map(x=>'<span>'+x+': <b>'+c[x]+'</b></span>').join('')+'</div>'+histTable(s);
}
function histTable(s){
 const rows=histRows(s.id);
 return '<table><tr><th>التاريخ</th><th>الحالة</th><th>الوقت</th><th class="l">التفاصيل</th></tr>'+rows.map(([d,r])=>{
  const v=DB.points.filter(p=>(r.vals||{})[p.id]).map(p=>esc(p.name)+': '+esc(r.vals[p.id])+(p.share?'':' (داخلي)')).join('<br>');
  return '<tr><td>'+fd(d)+'</td><td>'+esc(r.status||'—')+'</td><td>'+esc(r.time||'')+'</td><td class="l">'+v+thumTxt(r)+(r.note?'<br><b>داخلي:</b> '+esc(r.note):'')+(r.shareNote?'<br><b>لولي الأمر:</b> '+esc(r.shareNote):'')+'</td></tr>'}).join('')+'</table>';
}
function histPrint(id){const s=DB.students.find(x=>x.id===id);printHTML('<h2>'+esc(DB.settings.center)+' — سجل الطالب: '+esc(s.name)+'</h2><p style="color:#a00">وثيقة داخلية: تحتوي ملاحظات لا تُسلَّم لولي الأمر</p>'+histTable(s))}
function histCSV(id){
 const s=DB.students.find(x=>x.id===id);const ps=DB.points;
 const rows=[['التاريخ','الحالة','الوقت'].concat(ps.map(p=>p.name),['ملاحظة داخلية','ملاحظة لولي الأمر'])];
 histRows(id).forEach(([d,r])=>rows.push([d,r.status||'',r.time||''].concat(ps.map(p=>(r.vals||{})[p.id]||''),[r.note||'',r.shareNote||''])));
 dl('سجل-'+s.name+'.csv',csv(rows),'text/csv');
}

/* ========== نقاط المتابعة ========== */
function pMove(id,d){const i=DB.points.findIndex(p=>p.id===id),j=i+d;if(j<0||j>=DB.points.length)return;const t=DB.points[i];DB.points[i]=DB.points[j];DB.points[j]=t;save();render()}
/* ========== الرسائل (مستقلة عن وسيلة الإرسال) ========== */
function buildMessages(date){
 const recs=DB.records[date]||{};
 return DB.students.filter(s=>s.active&&recs[s.id]&&recs[s.id].status).map(s=>{
  const r=recs[s.id];
  return{sid:s.id,name:s.name,parent:s.parent,phone:normPhone(s.phone)||normPhone(s.phone2),channel:s.channel,text:fill(DB.templates[r.status],s,r,date),sent:!!r.sent};
 });
}
function getText(m){const k=UI.date+'|'+m.sid;return UI.edits[k]!==undefined?UI.edits[k]:m.text}
function vMsgs(){
 const ms=buildMessages(UI.date);
 let h='<div class="bar"><input type="date" value="'+UI.date+'" onchange="UI.date=this.value||today();render()"></div><p class="muted small">كل رسالة تُبنى لطالب واحد فقط، ولا تحتوي إلا النقاط المفعّلة لولي الأمر. يمكنك تعديل أي رسالة قبل استخدامها.</p>';
 if(!ms.length)h+='<div class="warn">لا توجد رسائل لهذا اليوم. سجّل الحضور أولًا من تبويب «اليوم».</div>';
 else{
  h+='<div class="chips"><button onclick="msgCopyAll()">نسخ الكل</button><button onclick="msgTxt()">ملف نصي</button><button onclick="msgCSV()">Excel للإرسال الآلي</button><button onclick="msgPrint()">طباعة / PDF</button></div>';
  h+='<div class="muted small">تم الإرسال: '+ms.filter(m=>m.sent).length+' من '+ms.length+'</div>';
  ms.forEach(m=>{
   h+='<div class="card '+(m.sent?'sent':'')+'"><div class="row"><b>'+esc(m.name)+'</b><span class="muted small">'+esc(m.parent||'')+' '+(m.phone?'+'+m.phone:'⚠ لا يوجد رقم')+'</span></div>'+
   '<textarea rows="6" onchange="UI.edits[UI.date+\'|'+m.sid+'\']=this.value">'+esc(getText(m))+'</textarea>'+
   '<div class="chips"><button onclick="msgWA(\''+m.sid+'\')">واتساب</button><button onclick="msgSMS(\''+m.sid+'\')">SMS</button><button onclick="msgCopy(\''+m.sid+'\')">نسخ</button><button onclick="msgSent(\''+m.sid+'\')">'+(m.sent?'↩ إلغاء «تم»':'✔ تم الإرسال')+'</button></div><div class="muted small">القناة المفضلة: '+esc(m.channel)+'</div></div>';
  });
 }
 h+='<h3>قوالب الرسائل</h3><p class="muted small">المتغيرات: {الطالب} {ولي_الأمر} {التاريخ} {الوقت} {الحالة} {التفاصيل} {ملاحظة}</p>';
 STATUSES.forEach(s=>h+='<label>'+s+'<textarea rows="5" onchange="DB.templates[\''+s+'\']=this.value;save()">'+esc(DB.templates[s])+'</textarea></label>');
 h+='<button onclick="tplReset()">استعادة القوالب الأصلية</button>';
 return h;
}

function chart(title,A,series,o){
 o=o||{};const W=360,H=190,L=30,R=8,T=10,B=26,pw=W-L-R,ph=H-T-B,n=A.keys.length;
 let all=[];
 if(o.stack)for(let i=0;i<n;i++)all.push(sum(series.map(s=>s.v[i]||0)));else series.forEach(s=>s.v.forEach(x=>{if(x!=null)all.push(x)}));
 const leg='<div class="sum">'+series.map(s=>`<span><i style="display:inline-block;width:10px;height:10px;background:${s.c};border-radius:2px"></i> ${s.n}</span>`).join('')+'</div>';
 if(!all.length||(!o.line&&all.every(x=>!x)))return `<div class="card"><b>${title}</b><p class="muted small">لا توجد بيانات مسجّلة في هذه الفترة.</p></div>`;
 let mx=Math.max(0,...all),mn=o.line?Math.min(0,...all):0;if(o.max)mx=o.max;if(mx===mn)mx=mn+1;
 const y=v=>T+ph-(v-mn)/(mx-mn)*ph,x=i=>L+pw*(i+.5)/n;
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;direction:ltr;font-size:9px;fill:#6b7a74">`;
 [mn,(mn+mx)/2,mx].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#dde5e1"/><text x="${L-3}" y="${y(v)+3}" text-anchor="end">${fm(v)}</text>`);
 if(o.line)series.forEach(se=>{let d='',pen=0;se.v.forEach((v,i)=>{if(v==null){pen=0;return}d+=(pen?'L':'M')+x(i)+' '+y(v);pen=1});
  s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2"/>`;if(n<=40)se.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${se.c}"/>`})});

function times(a,r){const st=r.status,P=isP(st);
 switch(a.auto){case 'present':return P?1:0;case 'late':return st==='متأخر'?1:0;case 'abs_ok':return st==='مستأذن'?1:0;case 'abs_no':return st==='غائب'&&!r.absAsk?1:0;case 'thumn':return P?thCnt(r):0}
 return a.more&&P&&(r.acts||{})[a.id]?1:0}
function sync(r){const old=r.pts||[],ok=e=>e.pk||e.aid+'#0';r.pts=[];
 DB.acts.forEach(a=>{const n=times(a,r);for(let i=0;i<n;i++){const k=a.id+'#'+i,e=old.find(x=>ok(x)===k);
  if(e){e.pk=k;r.pts.push(e)}else if(!a.del)r.pts.push({aid:a.id,pk:k,name:a.name+(n>1?' ('+(i+1)+')':''),pts:a.pts})}});
 if(isP(r.status))DB.points.forEach(p=>{const v=(r.vals||{})[p.id];if(!v||p.type!=='choice')return;const k='p:'+p.id;
  const e=old.find(x=>ok(x)===k&&x.v===v);if(e){r.pts.push(e);return}
  if(!p.active||p.del)return;const sb=(p.subs||[]).find(x=>x.name===v);if(sb&&sb.pts)r.pts.push({aid:k,pk:k,v,name:p.name+': '+v,pts:sb.pts})})}

  h+=`<div class="chips"><button onclick="pMove('${id}',-1)">↑</button><button onclick="pMove('${id}',1)">↓</button><button class="red" onclick="pDel('${id}')">حذف</button></div></div>`});
 return h}
function pAdd(){const n=$('#np').value.trim();if(!n)return;DB.points.push({id:uid(),name:n,type:'choice',subs:[],options:'',active:true,share:false});save();render()}
function pEdit(id,k,v){const p=DB.points.find(x=>x.id===id);if(['active','share','today'].includes(k))v=(v===true||v==='true');p[k]=v;if(k==='type'&&v==='choice'&&!p.subs)p.subs=[];save();if(k!=='name')render()}
function pDel(id){if(!confirm('حذف العنصر؟ تبقى بياناته وسجلاته السابقة محفوظة في السجلات والتقارير.'))return;const p=DB.points.find(x=>x.id===id);p.del=true;p.active=false;save();render()}
function sEdit(pid,sid,k,v){const x=DB.points.find(p=>p.id===pid).subs.find(s=>s.id===sid);x[k]=k==='pts'?(parseFloat(v)||0):v;save();if(k==='pts')render()}
function sDel(pid,sid){const p=DB.points.find(x=>x.id===pid);p.subs=p.subs.filter(s=>s.id!==sid);save();render()}
function sAdd(pid){const n=$('#sn_'+pid).value.trim();if(!n)return;DB.points.find(x=>x.id===pid).subs.push({id:uid(),name:n,pts:parseFloat($('#sv_'+pid).value)||0});save();render()}
/* ----- الإعدادات (لوحة تحكم) ----- */
const SEC=[['students','1. إعدادات الطلاب'],['att','2. إعدادات الحضور'],['acts','3. إعدادات الأنشطة'],['pts','4. إعدادات النقاط'],['msg','5. إعدادات الرسائل'],['rep','6. إعدادات التقارير'],['sys','7. النسخ الاحتياطي والنظام']];
function actRow(a,full){return `<div class="card" style="margin:6px 0"><input value="${esc(a.name)}" onchange="aEdit('${a.id}','name',this.value)"><div class="bar"><input type="number" step="0.5" inputmode="decimal" value="${a.pts}" onchange="aEdit('${a.id}','pts',this.value)"><span class="small ${a.pts>0?'shr':a.pts<0?'int':'muted'}" style="min-width:90px;align-self:center">${a.pts>0?'تُضاف لرصيد الطالب':a.pts<0?'تُخصم من رصيده':'بدون أثر'}</span></div>`+(full?`<label><input type="checkbox" ${a.more?'checked':''} onchange="aEdit('${a.id}','more',this.checked)">يظهر في زر «المزيد»</label><button class="red" onclick="aDel('${a.id}')">حذف</button>`:'')+'</div>'}
function secBody(k){
 const S=DB.settings;
 if(k==='students'){const l=sortS(DB.students);return `<p class="muted small">جدد: ${l.filter(s=>s.type==='جديد').length} — مستمرون: ${l.filter(s=>s.type==='مستمر').length} — غير محدد: ${l.filter(s=>!s.type).length}</p><button onclick="go('students')">إدارة بيانات الطلاب ←</button>`+l.map(s=>`<div class="row" style="margin-top:8px"><span class="small" style="flex:1">${esc(nm(s))}${s.active?'':' (متوقف)'}</span><select style="width:auto" onchange="stuType('${s.id}',this.value)">${['','جديد','مستمر'].map(t=>`<option value="${t}" ${(s.type||'')===t?'selected':''}>${t||'غير محدد'}</option>`).join('')}</select></div>`).join('')}
 if(k==='att')return '<p class="muted small">قيمة النقاط لكل حالة. أدخل رقمًا موجبًا للإضافة أو سالبًا (مثل -0.5) للخصم، أو 0 بلا أثر.</p>'+DB.acts.filter(a=>!a.del&&['present','late','abs_ok','abs_no','thumn'].includes(a.auto)).map(a=>`<div class="small muted">${AUTO.find(x=>x[0]===a.auto)[1]}${a.auto==='thumn'?' (لكل ثمن)':''}</div>`+actRow(a,false)).join('');
 if(k==='acts')return '<p class="muted small">أنشطة تظهر في زر «المزيد» عند تسجيل المتابعة (تسميع، مراجعة، تصحيح...). الحذف يُبقي سجلاتها القديمة.</p>'+DB.acts.filter(a=>!a.del&&!a.auto).map(a=>actRow(a,true)).join('')+'<div class="card"><b>نشاط جديد</b><input id="na" placeholder="اسم النشاط"><input id="nv" type="number" step="0.5" inputmode="decimal" placeholder="النقاط (± )"><button class="pri" onclick="aAdd()">+ إضافة نشاط</button></div>';
 if(k==='pts')return vItems();
 if(k==='msg')return `<p class="muted small">المعلومات الداخلية لا تُرسل أبدًا. اختر ما يُضاف إلى رسالة ولي الأمر:</p><label><input type="checkbox" ${S.msgThumn!==false?'checked':''} onchange="DB.settings.msgThumn=this.checked;save()">عدد الأثمان المكتملة</label><label><input type="checkbox" ${S.msgPts?'checked':''} onchange="DB.settings.msgPts=this.checked;save()">نقاط اليوم</label><p class="muted small">وكل عنصر متابعة تحدد خصوصيته (داخلي / يُرسل) من قسم «إعدادات النقاط».</p><button onclick="go('msgs')">تعديل قوالب الرسائل ←</button>`;
 if(k==='rep')return `<label>الفترة الافتراضية للرسوم<select onchange="DB.settings.defMode=this.value;save()">${[['day','يوم'],['week','أسبوع'],['month','شهر']].map(m=>`<option value="${m[0]}" ${S.defMode===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select></label><label>عدد الطلاب في مقارنة التطور الافتراضية<select onchange="DB.settings.topN=+this.value;save()">${[3,5,8].map(n=>`<option ${S.topN===n?'selected':''}>${n}</option>`).join('')}</select></label><p class="muted small">تُطبَّق عند فتح التقارير من جديد.</p>`;
 return vBackup0();
}
function stuType(id,v){DB.students.find(s=>s.id===id).type=v;save()}
function vBackup(){return SEC.map(([k,t])=>`<div class="card"><div class="row" style="margin:0" onclick="UI.sec=UI.sec==='${k}'?null:'${k}';render()"><b>${t}</b><span>${UI.sec===k?'▲':'▼'}</span></div>${UI.sec===k?secBody(k):''}</div>`).join('')}
function aEdit(id,k,v){const a=DB.acts.find(x=>x.id===id);a[k]=k==='pts'?(parseFloat(v)||0):v;save();if(k!=='name')render()}
/* ----- التقارير: منحنيات ----- */
function agg(sids,from,to){
 const days=Math.round((new Date(to)-new Date(from))/864e5)+1,g=days<=31?'d':days<=120?'w':'m';
 const bk=d=>g==='d'?d:g==='m'?d.slice(0,7):addDays(d,-((new Date(d+'T00:00:00').getDay()+1)%7));
 const keys=[],ix={};
 for(let d=from,i=0;d<=to&&i<800;d=addDays(d,1),i++){const k=bk(d);if(!(k in ix)){ix[k]=keys.length;keys.push(k)}}
 const z=()=>keys.map(()=>0),o={keys,labels:keys.map(k=>g==='m'?k:k.slice(5).replace('-','/')),p:z(),a:z(),l:z(),rv:z(),th:z(),pts:z(),pg:z(),pl:z(),ls:z(),lc:z()};
 const set=new Set(sids),pt=(i,v)=>{o.pts[i]+=v;if(v>0)o.pg[i]+=v;else o.pl[i]+=v};
 Object.keys(DB.records).forEach(d=>{if(d<from||d>to)return;const i=ix[bk(d)];if(i===undefined)return;
  set.forEach(sid=>{const r=DB.records[d][sid];if(!r)return;const st=r.status;
   if(isP(st))o.p[i]++;else if(st)o.a[i]++;
   if(st==='متأخر')o.l[i]++;
   if(rvOf(r))o.rv[i]++;
   o.th[i]+=thCnt(r);
   const sc=lvlOf(r);if(sc!=null){o.ls[i]+=sc;o.lc[i]++}
   (r.pts||[]).forEach(x=>pt(i,x.pts))})});
 DB.ledger.forEach(e=>{if(e.date<from||e.date>to||!set.has(e.sid))return;const i=ix[bk(e.date)];if(i!==undefined)pt(i,e.pts)});
 o.lv=o.ls.map((t,i)=>o.lc[i]?Math.round(t/o.lc[i]*10)/10:null);
 return o}
function per(m){const t=today();return m==='day'?[t,t]:m==='month'?[t.slice(0,8)+'01',t]:[addDays(t,-6),t]}
function chSet(m){const C=UI.ch;C.mode=m;if(m!=='custom'){const p=per(m);C.from=p[0];C.to=p[1]}render()}
function cmpTog(id){const c=UI.ch.cmp,i=c.indexOf(id);if(i>=0)c.splice(i,1);else if(c.length<8)c.push(id);render()}
function vCharts(){
 const S=DB.settings;
 if(!UI.ch){const m=S.defMode||'week',p=per(m);UI.ch={mode:m,from:p[0],to:p[1],sid:'all',type:'',cmp:[]}}
 const C=UI.ch;if(C.from>C.to)C.to=C.from;
 const pool=sortS(DB.students.filter(s=>s.active&&(!C.type||s.type===C.type)));
 if(C.sid!=='all'&&!pool.find(s=>s.id===C.sid))C.sid='all';
 let h='<h3>📈 المنحنيات والإحصائيات</h3><div class="chips">'+[['day','يوم'],['week','أسبوع'],['month','شهر'],['custom','فترة محددة']].map(m=>`<button class="${C.mode===m[0]?'pri':''}" onclick="chSet('${m[0]}')">${m[1]}</button>`).join('')+'</div>';
 h+=`<div class="bar"><input type="date" value="${C.from}" onchange="UI.ch.from=this.value;UI.ch.mode='custom';render()"><input type="date" value="${C.to}" onchange="UI.ch.to=this.value;UI.ch.mode='custom';render()"></div>`;
 h+=`<div class="bar"><select onchange="UI.ch.type=this.value;render()">${[['','كل الطلاب'],['جديد','الطلاب الجدد'],['مستمر','الطلاب المستمرون']].map(t=>`<option value="${t[0]}" ${C.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select><select onchange="UI.ch.sid=this.value;render()"><option value="all">عرض جميع الطلاب</option>${pool.map(s=>`<option value="${s.id}" ${C.sid===s.id?'selected':''}>${esc(nm(s))}</option>`).join('')}</select></div>`;
 const chips=(A,sc)=>{const P=sum(A.p),Ab=sum(A.a);return `<div class="sum"><span>حضور: <b>${P}</b></span><span>غياب: <b>${Ab}</b></span><span>تأخير: <b>${sum(A.l)}</b></span><span>أثمان: <b>${sum(A.th)}</b></span><span>صافي النقاط: <b>${fm(sum(A.pts))}</b></span></div>`};
 const att=A=>chart('الحضور والغياب',A,[{n:'حضور',c:'#2e9e5b',v:A.p},{n:'غياب',c:'#d64545',v:A.a}],{line:1});
 const gl=A=>chart('النقاط المكتسبة والمخصومة',A,[{n:'مكتسبة',c:'#2e9e5b',v:A.pg},{n:'مخصومة',c:'#d64545',v:A.pl}],{line:1});
 if(C.sid!=='all'){
  const A=agg([C.sid],C.from,C.to);
  return h+chips(A)+chart('تطور درجات التسميع',A,[{n:'الدرجة',c:LC[3],v:A.lv}],{line:1})+chart('عدد الأثمنة المكتملة',A,[{n:'أثمان',c:LC[0],v:A.th}],{line:1})+att(A)+gl(A)+chart('مجموع النقاط التراكمي',A,[{n:'الرصيد',c:LC[5],v:cum(A.pts)}],{line:1});
 }
 const T=agg(pool.map(s=>s.id),C.from,C.to);
 const R=pool.map(s=>{const x=agg([s.id],C.from,C.to),t=sum(x.p)+sum(x.a);return{s,x,att:t?Math.round(sum(x.p)/t*100):null,l:sum(x.l),th:sum(x.th),pts:Math.round(sum(x.pts)*10)/10,lv:sum(x.lc)?Math.round(sum(x.ls)/sum(x.lc)*10)/10:null}});
 h+=chips(T)+att(T)+chart('عدد الأثمنة (المركز)',T,[{n:'أثمان',c:LC[0],v:T.th}],{line:1})+gl(T)+chart('مجموع النقاط التراكمي (المركز)',T,[{n:'الرصيد',c:LC[5],v:cum(T.pts)}],{line:1});
 h+='<h3>مقارنة الطلاب</h3><p class="muted small">اختر طلابًا للمقارنة (حتى 8). وبدون اختيار يُعرض أفضل '+(S.topN||5)+' بالنقاط.</p><div class="chips">'+pool.map(s=>`<button class="chip ${C.cmp.includes(s.id)?'on v':''}" onclick="cmpTog('${s.id}')">${esc(s.name)}</button>`).join('')+'</div>';
 let sl=R.filter(r=>C.cmp.includes(r.s.id));if(!sl.length)sl=R.slice().sort((a,b)=>b.pts-a.pts).slice(0,S.topN||5);
 h+=chart('تطور النقاط التراكمي',T,sl.map((r,i)=>({n:r.s.name,c:LC[i],v:cum(r.x.pts)})),{line:1})+chart('عدد الأثمنة',T,sl.map((r,i)=>({n:r.s.name,c:LC[i],v:r.x.th})),{line:1})+chart('درجات التسميع',T,sl.map((r,i)=>({n:r.s.name,c:LC[i],v:r.x.lv})),{line:1});
 h+=hbar('نسبة الحضور لكل طالب',R.map(r=>({n:r.s.name,v:r.att})),'#2e9e5b',v=>v+'%')+hbar('إجمالي الأثمنة',R.map(r=>({n:r.s.name,v:r.th})),LC[0],v=>v)+hbar('مرات التأخير',R.map(r=>({n:r.s.name,v:r.l})),'#e69b1e',v=>v)+hbar('معدل درجة التسميع',R.map(r=>({n:r.s.name,v:r.lv})),LC[3],fm)+hbar('مجموع النقاط',R.map(r=>({n:r.s.name,v:r.pts})),'#3b7fd4',fm);
 return h;
}
/* ----- جدول الفترة ----- */
function rangeData(from,to){
 const rp=DB.points.find(p=>p.key==='recite');
 return sortS(DB.students.filter(s=>s.active)).map(s=>{
  const c={};STATUSES.forEach(x=>c[x]=0);let rc=0,days=0,th=0,pt=0;
  Object.keys(DB.records).forEach(d=>{if(d<from||d>to)return;const r=DB.records[d][s.id];if(!r||!r.status)return;days++;c[r.status]++;th+=thCnt(r);pt+=sum((r.pts||[]).map(x=>x.pts));if(rp&&reciteClass((r.vals||{})[rp.id])==='yes')rc++});
  DB.ledger.forEach(e=>{if(e.sid===s.id&&e.date>=from&&e.date<=to)pt+=e.pts});
  return{s,c,rc,days,th,pt:Math.round(pt*10)/10};
 });
}
function rangeTable(from,to){
 const d=rangeData(from,to);
 return '<table><tr><th class="l">الطالب</th>'+STATUSES.map(x=>'<th>'+x+'</th>').join('')+'<th>سمّع</th><th>أثمان</th><th>نقاط</th></tr>'+d.map(r=>'<tr><td class="l">'+esc(nm(r.s))+(r.s.type==='جديد'?' 🆕':'')+'</td>'+STATUSES.map(x=>'<td>'+r.c[x]+'</td>').join('')+'<td>'+r.rc+'</td><td><b>'+r.th+'</b></td><td>'+r.pt+'</td></tr>').join('')+'</table>';
}
function rangeCSV(){
 const R=UI.rep;
 dl('تقرير-'+R.from+'_'+R.to+'.csv',csv([['الطالب','حالة الطالب'].concat(STATUSES,['سمّع المقرر','الأثمان','النقاط'])].concat(rangeData(R.from,R.to).map(r=>[r.s.name,r.s.type||''].concat(STATUSES.map(x=>r.c[x]),[r.rc,r.th,r.pt])))),'text/csv');
}

function vReports(){return vReports0()+vCharts()}

load();render();
</script>
